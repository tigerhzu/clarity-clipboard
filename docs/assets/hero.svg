<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="488" viewBox="0 0 1280 488" role="img" aria-labelledby="title desc">
<title id="title">Clarity Clipboard — Keep the useful. Find it when you need it.</title><desc id="desc">A local-first Windows clipboard and personal snippet library.</desc>
